[project]
name = "maagaparuga-assessment"
version = "0.1.0"
description = "Scoring service: NEWS2 early-warning, DASS21 questionnaire, fuzzy risk — over telemetry windows and questionnaire responses."
requires-python = ">=3.12"
# Runtime deps. The pure scoring core (news2, dass21) needs only the stdlib;
# scikit-fuzzy/numpy power the fuzzy-risk module; fastapi/psycopg are the API
# and persistence layers. Versions are minimum-stable and refreshed by the
# dependency-update automation (ADR 0013).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "scikit-fuzzy>=0.5",
    "scipy>=1.14",       # scikit-fuzzy imports scipy.linalg but doesn't declare it
    "networkx>=3.3",     # scikit-fuzzy.control (also undeclared upstream)
    "packaging>=24",     # scikit-fuzzy.image imports packaging (also undeclared upstream)
    "psycopg[binary]>=3.2",
    "clickhouse-connect>=0.8",
    "grpcio>=1.66",
    "protobuf>=5.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assessment"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # scikit-fuzzy 0.5 uses an np.maximum call pattern numpy 2.x deprecates —
    # upstream's issue, not ours; ignore so our own warnings stay visible.
    "ignore:Passing more than 2 positional arguments:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/assessment/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["src/assessment/gen/"]

[[tool.mypy.overrides]]
module = ["skfuzzy.*", "clickhouse_connect.*", "psycopg.*", "grpc", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated gRPC stubs — treat as untyped (Any) without analysing them.
module = ["assessment.gen.*"]
follow_imports = "skip"
ignore_missing_imports = true
