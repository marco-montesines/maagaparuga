# Shared Ansible variables. `env` is overridden on the command line
# (-e env=production) and selects which deploy/k8s overlay is applied.
---
ssh_port: 10022
env: production

# k3s release channel (or pin an exact version in k3s_version below).
k3s_channel: stable
k3s_version: "" # empty -> use the channel; set e.g. "v1.31.5+k3s1" to pin

# OpenSearch requires a high mmap count on every node it could schedule to.
opensearch_max_map_count: 262144

# CloudNativePG operator (Postgres CRDs). HOLD at <=1.30.x — 1.31 removes the
# in-tree barmanObjectStore the cluster.yaml uses (matches the Makefile pin).
cnpg_version: "1.30.0"

# GHCR image-pull secret (private app images, repo private until P8). Leave
# ghcr_pull_token EMPTY here — pass the real read:packages token out of band
# (`-e ghcr_pull_token=...` or a vault). Empty => the pull-secret step is skipped
# (e.g. after P8 when the packages are public).
ghcr_username: marco-montesines
ghcr_pull_token: ""
