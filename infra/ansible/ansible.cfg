[defaults]
inventory = inventory.generated.yml
host_key_checking = False
roles_path = roles
# YAML-formatted output via the built-in default callback (the old
# community.general.yaml callback was removed in community.general 12).
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# The Terragrunt-emitted inventory sets ansible_port: 10022 + ansible_user.

[ssh_connection]
pipelining = True
