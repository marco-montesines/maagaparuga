# Deploy the app: copy the kustomize tree to the control-plane node and apply the
# environment overlay with the cluster's own kubectl. REAL secrets (Hetzner-free
# things like the B2/DO backup keys, OpenSearch credentials, ZITADEL client) are
# provisioned SEPARATELY — the overlay ships placeholders/SealedSecrets, not real
# values (nothing sensitive is committed).
---
- name: Ensure the deploy directory exists on the server
  ansible.builtin.file:
    path: /opt/maagaparuga
    state: directory
    mode: "0750"

- name: Copy the kustomize manifests to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/k8s/"
    dest: /opt/maagaparuga/deploy/k8s/
    mode: preserve

# The overlay's Postgres Cluster/Database/ScheduledBackup need the CloudNativePG
# CRDs, so install the operator FIRST (pinned <=1.30.x — the in-tree
# barmanObjectStore we use is removed in 1.31; see the Makefile note).
- name: Install the CloudNativePG operator (provides the Postgres CRDs)
  ansible.builtin.command:
    cmd: >
      k3s kubectl apply --server-side -f
      https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v{{ cnpg_version }}/cnpg-{{ cnpg_version }}.yaml
  register: cnpg_apply
  changed_when: "'created' in cnpg_apply.stdout or 'configured' in cnpg_apply.stdout"

- name: Wait for the CNPG operator to be ready
  ansible.builtin.command:
    cmd: k3s kubectl -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=180s
  changed_when: false

# While the app images are PRIVATE on GHCR the pods need a read:packages pull
# secret. Create it BEFORE the overlay so the first schedule pulls cleanly
# (skipped if no token is supplied — e.g. if the packages are made public).
# The overlay's default ServiceAccount references this secret by name (ghcr-pull).
- name: Ensure the app namespace exists (for the pull secret)
  ansible.builtin.command:
    cmd: k3s kubectl create namespace maagaparuga --dry-run=client -o yaml
  register: ns_manifest
  changed_when: false
  when: ghcr_pull_token | default('') | length > 0

- name: Apply the app namespace
  ansible.builtin.shell:
    cmd: echo '{{ ns_manifest.stdout }}' | k3s kubectl apply -f -
  changed_when: "'created' in ns_apply.stdout"
  register: ns_apply
  when: ghcr_pull_token | default('') | length > 0

- name: Create/update the GHCR image-pull secret
  ansible.builtin.shell:
    cmd: >
      k3s kubectl -n maagaparuga create secret docker-registry ghcr-pull
      --docker-server=ghcr.io
      --docker-username={{ ghcr_username }}
      --docker-password='{{ ghcr_pull_token }}'
      --dry-run=client -o yaml | k3s kubectl apply -f -
  register: ghcr_secret
  changed_when: "'created' in ghcr_secret.stdout or 'configured' in ghcr_secret.stdout"
  no_log: true
  when: ghcr_pull_token | default('') | length > 0

- name: Apply the {{ env }} overlay
  ansible.builtin.command:
    cmd: k3s kubectl apply -k /opt/maagaparuga/deploy/k8s/overlays/{{ env }}
  register: kubectl_apply
  changed_when: "'created' in kubectl_apply.stdout or 'configured' in kubectl_apply.stdout"

- name: Show what changed
  ansible.builtin.debug:
    var: kubectl_apply.stdout_lines
