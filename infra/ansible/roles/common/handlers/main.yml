---
- name: Restart ssh
  # daemon_reload re-runs the generator so ssh.socket picks up the new sshd_config
  # Port; restarting the socket rebinds it.
  ansible.builtin.systemd:
    name: ssh.socket
    state: restarted
    daemon_reload: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
