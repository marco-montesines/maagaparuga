<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.2" />
    </linearGradient>
    
    <linearGradient id="grad-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0" />
      <stop offset="50%" stop-color="#5eead4" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </linearGradient>
    
    <radialGradient id="hub-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    .ring-1 {
      transform-origin: 200px 200px;
      animation: rotate-cw 25s linear infinite;
    }
    .ring-2 {
      transform-origin: 200px 200px;
      animation: rotate-ccw 35s linear infinite;
    }
    .ring-3 {
      transform-origin: 200px 200px;
      animation: rotate-cw 50s linear infinite;
    }
    .pulse-circle {
      transform-origin: 0px 0px;
      animation: pulse-scale 3s ease-in-out infinite alternate;
    }
    .core-heart {
      transform-origin: 0px 0px;
      animation: heart-beat 2s infinite cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .core-glow {
      transform-origin: 0px 0px;
      animation: glow-pulse 4s infinite ease-in-out alternate;
    }
    .data-flow {
      animation: flow 6s linear infinite;
    }
    .telemetry-pulse {
      stroke-dasharray: 180 950;
      stroke-dashoffset: 1130;
      animation: pulse-travel 5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }
    .care-cross {
      transform-origin: 0px 0px;
      animation: float-cross 6s ease-in-out infinite alternate;
    }

    @keyframes rotate-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse-scale {
      0% { transform: scale(0.7); opacity: 0.15; }
      100% { transform: scale(1.3); opacity: 0.45; }
    }
    @keyframes heart-beat {
      0% { transform: scale(1); }
      14% { transform: scale(1.15); }
      28% { transform: scale(1); }
      42% { transform: scale(1.15); }
      70% { transform: scale(1); }
    }
    @keyframes glow-pulse {
      0% { transform: scale(0.85); opacity: 0.2; }
      100% { transform: scale(1.2); opacity: 0.55; }
    }
    @keyframes flow {
      to { stroke-dashoffset: -32; }
    }
    @keyframes pulse-travel {
      0% { stroke-dashoffset: 1130; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-cross {
      0% { transform: translateY(0px) scale(0.9); opacity: 0.2; }
      50% { transform: translateY(-6px) scale(1.1) rotate(15deg); opacity: 0.5; }
      100% { transform: translateY(0px) scale(0.9); opacity: 0.2; }
    }
  </style>

  <!-- Ambient Grid System -->
  <g stroke="currentColor" stroke-width="0.5" opacity="0.06" stroke-dasharray="2 10">
    <line x1="50" y1="100" x2="350" y2="100" />
    <line x1="50" y1="200" x2="350" y2="200" />
    <line x1="50" y1="300" x2="350" y2="300" />
    <line x1="100" y1="50" x2="100" y2="350" />
    <line x1="200" y1="50" x2="200" y2="350" />
    <line x1="300" y1="50" x2="300" y2="350" />
  </g>

  <!-- Concentric Telemetry Signal Rings -->
  <circle cx="200" cy="200" r="50" class="ring-1" stroke="url(#grad-teal)" stroke-width="1.5" stroke-dasharray="8 12 4 8" fill="none" opacity="0.4" />
  <circle cx="200" cy="200" r="90" class="ring-2" stroke="#14b8a6" stroke-width="1" stroke-dasharray="140 40 20 40" fill="none" opacity="0.2" />
  <circle cx="200" cy="200" r="130" class="ring-3" stroke="#5eead4" stroke-width="1" stroke-dasharray="60 20 10 20" fill="none" opacity="0.15" />

  <!-- Microservice Communication Mesh -->
  <g stroke="#14b8a6" stroke-width="1" fill="none">
    <!-- Hub Spokes -->
    <line x1="200" y1="200" x2="105" y2="115" opacity="0.15" />
    <line x1="200" y1="200" x2="295" y2="95" opacity="0.15" />
    <line x1="200" y1="200" x2="285" y2="285" opacity="0.15" />
    <line x1="200" y1="200" x2="115" y2="275" opacity="0.15" />

    <!-- Mesh Ring -->
    <line x1="55" y1="195" x2="105" y2="115" opacity="0.15" />
    <line x1="105" y1="115" x2="295" y2="95" opacity="0.15" />
    <line x1="295" y1="95" x2="345" y2="205" opacity="0.15" />
    <line x1="345" y1="205" x2="285" y2="285" opacity="0.15" />
    <line x1="285" y1="285" x2="115" y2="275" opacity="0.15" />
    <line x1="115" y1="275" x2="55" y2="195" opacity="0.15" />

    <!-- Animated Data Flow Overlays -->
    <line x1="105" y1="115" x2="295" y2="95" opacity="0.4" stroke-dasharray="6 18" class="data-flow" />
    <line x1="285" y1="285" x2="115" y2="275" opacity="0.4" stroke-dasharray="6 18" class="data-flow" style="animation-delay: -2s;" />
    <line x1="200" y1="200" x2="105" y2="115" opacity="0.4" stroke-dasharray="4 14" class="data-flow" style="animation-delay: -4s;" />
    <line x1="200" y1="200" x2="285" y2="285" opacity="0.4" stroke-dasharray="4 14" class="data-flow" style="animation-delay: -1s;" />
  </g>

  <!-- Ambient ECG / Pulse Base Line -->
  <path d="M 20,200 L 55,195 C 70,170 85,115 105,115 C 125,115 100,275 115,275 C 130,275 150,200 170,200 L 180,200 L 184,194 L 188,200 L 191,200 L 194,208 L 199,145 L 205,235 L 209,200 L 212,200 L 218,190 L 224,200 L 230,200 C 250,200 270,285 285,285 C 300,285 280,95 295,95 C 310,95 325,205 345,205 C 360,205 365,200 380,200" 
        fill="none" stroke="url(#grad-teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />

  <!-- Active Telemetry Pulse Wave (Glowing Foreground) -->
  <path d="M 20,200 L 55,195 C 70,170 85,115 105,115 C 125,115 100,275 115,275 C 130,275 150,200 170,200 L 180,200 L 184,194 L 188,200 L 191,200 L 194,208 L 199,145 L 205,235 L 209,200 L 212,200 L 218,190 L 224,200 L 230,200 C 250,200 270,285 285,285 C 300,285 280,95 295,95 C 310,95 325,205 345,205 C 360,205 365,200 380,200" 
        fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="telemetry-pulse" />

  <!-- Network Service Nodes -->
  <!-- Node A -->
  <g transform="translate(105, 115)">
    <circle r="10" fill="#14b8a6" class="pulse-circle" />
    <circle r="4.5" fill="#5eead4" />
  </g>
  <!-- Node B -->
  <g transform="translate(295, 95)">
    <circle r="12" fill="#0d9488" class="pulse-circle" style="animation-delay: -1.5s;" />
    <circle r="5" fill="#14b8a6" />
  </g>
  <!-- Node C -->
  <g transform="translate(285, 285)">
    <circle r="10" fill="#14b8a6" class="pulse-circle" style="animation-delay: -3s;" />
    <circle r="4.5" fill="#5eead4" />
  </g>
  <!-- Node D -->
  <g transform="translate(115, 275)">
    <circle r="13" fill="#0d9488" class="pulse-circle" style="animation-delay: -4.5s;" />
    <circle r="5.5" fill="#14b8a6" />
  </g>
  <!-- Node E -->
  <g transform="translate(55, 195)">
    <circle r="8" fill="#5eead4" class="pulse-circle" style="animation-delay: -0.8s;" />
    <circle r="3" fill="#5eead4" />
  </g>
  <!-- Node F -->
  <g transform="translate(345, 205)">
    <circle r="8" fill="#5eead4" class="pulse-circle" style="animation-delay: -2.3s;" />
    <circle r="3" fill="#5eead4" />
  </g>

  <!-- Central Caring Telemetry Hub -->
  <g transform="translate(200, 200)">
    <!-- Dynamic Hub Glow -->
    <circle r="34" fill="url(#hub-radial)" class="core-glow" />
    <!-- Outer Shield -->
    <circle r="22" fill="#0f766e" fill-opacity="0.8" stroke="#5eead4" stroke-width="1.5" />
    <circle r="17" fill="#0d9488" fill-opacity="0.4" />
    <!-- Caring Heart Core Shape -->
    <path d="M 0,-3 C -2,-7 -7,-7 -7,-3 C -7,1.5 0,6 0,6 C 0,6 7,1.5 7,-3 C 7,-7 2,-7 0,-3 Z" fill="#5eead4" class="core-heart" />
  </g>

  <!-- Decorative Floating Health / Care Symbols -->
  <g transform="translate(75, 80)">
    <g class="care-cross">
      <path d="M -4,0 L 4,0 M 0,-4 L 0,4" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
  <g transform="translate(330, 280)">
    <g class="care-cross" style="animation-delay: -2s;">
      <path d="M -3.5,0 L 3.5,0 M 0,-3.5 L 0,3.5" stroke="#5eead4" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>
  <g transform="translate(150, 320)">
    <g class="care-cross" style="animation-delay: -4s;">
      <path d="M -4,0 L 4,0 M 0,-4 L 0,4" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
  <g transform="translate(250, 65)">
    <g class="care-cross" style="animation-delay: -1s;">
      <path d="M -3,0 L 3,0 M 0,-3 L 0,3" stroke="#14b8a6" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>
</svg>