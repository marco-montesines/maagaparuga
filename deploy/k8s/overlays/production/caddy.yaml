# Caddy — the public TLS edge. It obtains + auto-renews a real Let's Encrypt
# certificate for the DuckDNS hostname (HTTP-01, no plugin/token needed — the
# hostname's A record just has to point at a node IP and :80 must be open, which
# the Hetzner firewall allows), terminates HTTPS, and reverse-proxies to APISIX.
# APISIX keeps doing all the gateway work (routes, rate-limit, real-IP, OIDC);
# Caddy only handles certs + TLS. Cert storage is a PVC so restarts don't re-issue
# (and don't burn Let's Encrypt rate limits).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
data:
  Caddyfile: |
    {
      # While testing, uncomment to use Let's Encrypt STAGING (avoids rate limits;
      # browsers will warn about the staging CA). Remove for real certs.
      # acme_ca https://acme-staging-v02.api.letsencrypt.org/directory
      # email you@example.com
    }
    maagaparuga.duckdns.org {
      reverse_proxy apisix:9080
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO cert volume
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
        app.kubernetes.io/part-of: maagaparuga
    spec:
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"] # bind :80/:443
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
            - name: data
              mountPath: /data # certs live here (persisted)
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  type: LoadBalancer # klipper binds host :80/:443 (the firewall admits only these)
  selector:
    app.kubernetes.io/name: caddy
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
