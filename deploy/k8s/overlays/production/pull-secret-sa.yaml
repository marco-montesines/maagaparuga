# Attach the GHCR pull secret to the namespace's DEFAULT ServiceAccount. None of
# the app workloads set a serviceAccountName, so they all run as `default` — this
# one attachment lets every app pod (web, web-queue, telemetry, telemetry-writer,
# assessment, media, media-worker, and the zitadel-bootstrap Job) pull the
# PRIVATE images that CI publishes to GHCR. Infra pods pull public images and
# simply ignore the extra credential.
#
# The `ghcr-pull` Secret itself is NOT committed (it holds a real GHCR
# read:packages token). Provision it out of band before/at deploy time — the
# Ansible deploy role creates it when `ghcr_pull_token` is set. See this
# overlay's README.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
imagePullSecrets:
  - name: ghcr-pull
