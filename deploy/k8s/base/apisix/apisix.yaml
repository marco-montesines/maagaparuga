# Apache APISIX — the API gateway (ADR 0003), standalone mode: routes come
# from a YAML ConfigMap, no etcd. The full route set (OIDC enforcement, gRPC
# transcoding, per-service policies) is P5; this base config carries health
# routing and placeholder upstreams so the gateway is exercised from day one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
data:
  config.yaml: |
    deployment:
      role: data_plane
      role_data_plane:
        config_provider: yaml
    apisix:
      node_listen: 9080
      enable_admin: false
  # Basic route set — the full configuration (OIDC enforcement, rate limiting
  # per route, per-env TLS) lands in P5.
  #
  # `protos` registers the telemetry contract so grpc-transcode can translate
  # JSON <-> protobuf. It is a copy of proto/maagaparuga/telemetry/v1/
  # vitals.proto (APISIX standalone reads protos only from this file);
  # `make proto-check` fails if the two drift apart.
  apisix-routes.yaml: |
    protos:
      - id: telemetry
        # A COMPILED descriptor set (base64 FileDescriptorSet), not .proto text.
        # APISIX tries text parsing first and falls back to this binary path,
        # which loads descriptors directly and skips its Lua .proto parser --
        # so modern proto3 features parse, and imported well-known types are
        # already embedded by the compiler (no vendored timestamp.proto).
        # Regenerate with `make gateway-proto` whenever proto/ changes.
        content: ""
    routes:
      - uri: /healthz
        upstream:
          nodes:
            "127.0.0.1:9080": 1
          type: roundrobin
        plugins:
          fault-injection:
            abort:
              http_status: 200
              body: "ok\n"
      # Telemetry over REST: the gateway transcodes JSON <-> gRPC against the
      # same service the devices stream to (ADR 0010 — one implementation,
      # two surfaces).
      #
      # These work because `protos` above carries a COMPILED descriptor set
      # rather than .proto text. Supplying text fails on this contract:
      # APISIX's Lua parser rejects proto3 `optional` (it never sets
      # lua-protobuf's opt-in flag) and the image ships no well-known types.
      # The binary path skips that parser entirely and the compiler has
      # already resolved the imports.
      #
      # Two quirks of the plugin's mapping, both harmless but worth knowing:
      #   - it uses lua-protobuf's table mapping, not canonical protobuf
      #     JSON: google.protobuf.Timestamp is {"seconds":N,"nanos":N},
      #     not an RFC3339 string, in BOTH directions;
      #   - proto3 `optional` compiles to a synthetic oneof, so responses
      #     carry an extra "_field":"field" presence marker (upstream
      #     lua-protobuf considers this correct output).
      - uri: /v1/vitals
        methods: [POST]
        plugins:
          grpc-transcode:
            proto_id: "telemetry"
            service: maagaparuga.telemetry.v1.VitalsService
            method: PublishVitals
        upstream:
          scheme: grpc
          nodes:
            "telemetry:9090": 1
          type: roundrobin
      - uri: /v1/vitals/window
        methods: [GET, POST]
        plugins:
          grpc-transcode:
            proto_id: "telemetry"
            service: maagaparuga.telemetry.v1.VitalsService
            method: GetWindow
        upstream:
          scheme: grpc
          nodes:
            "telemetry:9090": 1
          type: roundrobin

      # gRPC server reflection, so grpcurl and other tooling can introspect
      # the service through the gateway (device clients use generated stubs
      # and do not need this).
      - uri: /grpc.reflection.v1.ServerReflection/*
        upstream:
          scheme: grpc
          nodes:
            "telemetry:9090": 1
          type: roundrobin
      - uri: /grpc.reflection.v1alpha.ServerReflection/*
        upstream:
          scheme: grpc
          nodes:
            "telemetry:9090": 1
          type: roundrobin

      # Native gRPC passthrough for real device clients (streaming ingest
      # cannot be transcoded — it stays gRPC end to end).
      - uri: /maagaparuga.telemetry.v1.VitalsService/*
        upstream:
          scheme: grpc
          nodes:
            "telemetry:9090": 1
          type: roundrobin

      # Everything else -> the web application (Laravel/Octane).
      # P5 adds per-route policies (OIDC enforcement, rate limits) and TLS.
      - uri: /*
        upstream:
          nodes:
            "web:8080": 1
          type: roundrobin
    #END
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix
        app.kubernetes.io/part-of: maagaparuga
    spec:
      containers:
        - name: apisix
          image: apache/apisix:pinned
          ports:
            - name: http
              containerPort: 9080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            - name: config
              mountPath: /usr/local/apisix/conf/apisix.yaml
              subPath: apisix-routes.yaml
      volumes:
        - name: config
          configMap:
            name: apisix-config
---
apiVersion: v1
kind: Service
metadata:
  name: apisix
spec:
  selector:
    app.kubernetes.io/name: apisix
  ports:
    - name: http
      port: 9080
