# Apache APISIX — the API gateway (ADR 0003), standalone mode: routes come
# from a YAML ConfigMap, no etcd. The full route set (OIDC enforcement, gRPC
# transcoding, per-service policies) is P5; this base config carries health
# routing and placeholder upstreams so the gateway is exercised from day one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
data:
  config.yaml: |
    deployment:
      role: data_plane
      role_data_plane:
        config_provider: yaml
    apisix:
      node_listen: 9080
      enable_admin: false
  # Basic route set — the full configuration (OIDC enforcement, gRPC
  # transcoding, rate limiting per route, per-env TLS) lands in P5.
  apisix-routes.yaml: |
    routes:
      - uri: /healthz
        upstream:
          nodes:
            "127.0.0.1:9080": 1
          type: roundrobin
        plugins:
          fault-injection:
            abort:
              http_status: 200
              body: "ok\n"
      # Everything else -> the web application (Laravel/Octane).
      # P5 splits this into explicit routes (web, /graphql, telemetry
      # gRPC + transcode, assessment, media) with per-route policies.
      - uri: /*
        upstream:
          nodes:
            "web:8080": 1
          type: roundrobin
    #END
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix
        app.kubernetes.io/part-of: maagaparuga
    spec:
      containers:
        - name: apisix
          image: apache/apisix:pinned
          ports:
            - name: http
              containerPort: 9080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            - name: config
              mountPath: /usr/local/apisix/conf/apisix.yaml
              subPath: apisix-routes.yaml
      volumes:
        - name: config
          configMap:
            name: apisix-config
---
apiVersion: v1
kind: Service
metadata:
  name: apisix
spec:
  selector:
    app.kubernetes.io/name: apisix
  ports:
    - name: http
      port: 9080
