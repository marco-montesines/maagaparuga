# OpenFGA — relationship-based fine-grained authorization (ADR 0009).
# Services call its gRPC API; state lives in PostgreSQL.
# The authorization model (caregiver<->care-recipient assignments) ships with the web service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga
        app.kubernetes.io/part-of: maagaparuga
    spec:
      initContainers:
        - name: migrate
          image: openfga/openfga:pinned
          args: ["migrate"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: openfga-datastore
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: openfga
          image: openfga/openfga:pinned
          args: ["run"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: openfga-datastore
                  key: uri
          ports:
            - name: grpc
              containerPort: 8081
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
spec:
  selector:
    app.kubernetes.io/name: openfga
  ports:
    - name: grpc
      port: 8081
    - name: http
      port: 8080
