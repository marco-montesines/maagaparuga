# Application services — deployment shells for the microservices (ADR 0014):
# independently built, deployed, and scaled containers.
#
# The images are built in P2-P4; until then the dev overlay scales all of
# these to 0 replicas. Probes, env wiring, and ports are finalized alongside
# each service's implementation phase.
# In-cluster configuration shared by web + web-queue. Per-env values
# (FGA store/model ids, ZITADEL client) come from overlays.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  APP_ENV: production            # Laravel env name; NOT a readiness claim
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: maagaparuga-pg-rw
  DB_PORT: "5432"
  DB_DATABASE: app
  DB_USERNAME: app
  SESSION_DRIVER: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  OPENSEARCH_URL: http://opensearch:9200
  OPENFGA_URL: http://openfga:8080
  ZITADEL_BASE_URL: http://zitadel:8080
  AWS_ENDPOINT: http://seaweedfs:8333
  AWS_BUCKET: attachments
  AWS_DEFAULT_REGION: garage
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: maagaparuga
    spec:
      enableServiceLinks: false   # same collision class as the ZITADEL_PORT pitfall
      containers:
        - name: web
          image: ghcr.io/marco-montesines/maagaparuga-web:pinned
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maagaparuga-pg-app
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          ports:
            - name: http
              containerPort: 8080
          # Octane boots a worker pool + warms config/routes; startup gates
          # liveness (up to ~2m) so first boot is never read as a hang.
          startupProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
# App-internal task queue worker (Laravel queue on Redis — the queue rule):
# transcription indexing, notifications. Same image, CLI role.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-queue
        app.kubernetes.io/part-of: maagaparuga
    spec:
      enableServiceLinks: false
      containers:
        - name: web-queue
          image: ghcr.io/marco-montesines/maagaparuga-web:pinned
          args: ["queue"]
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secrets
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maagaparuga-pg-app
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
---
# Shared by telemetry (serve) and telemetry-writer (write).
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-config
data:
  NATS_URL: nats://nats:4222
  CLICKHOUSE_ADDR: clickhouse:9000
  CLICKHOUSE_DB: maagaparuga
  CLICKHOUSE_USER: maagaparuga
  # Device authentication. jwt = verify bearer tokens against the issuer's
  # JWKS (the production setting). The dev overlay currently sets
  # AUTH_MODE=disabled until the ZITADEL client/service-account bootstrap
  # lands; the service logs a loud warning whenever it runs that way.
  OIDC_ISSUER: http://zitadel:8080
  OIDC_AUDIENCE: telemetry
  AUTH_MODE: jwt
  # Per-object authorization (OpenFGA) is enforced whenever AUTH_MODE=jwt.
  # STORE/MODEL ids are set once the FGA store is bootstrapped (fga:bootstrap).
  OPENFGA_URL: http://openfga:8080
  OPENFGA_STORE_ID: ""
  OPENFGA_MODEL_ID: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry
        app.kubernetes.io/part-of: maagaparuga
    spec:
      containers:
        - name: telemetry
          image: ghcr.io/marco-montesines/maagaparuga-telemetry:pinned
          args: ["serve"]              # gRPC ingest + read API
          envFrom:
            - configMapRef:
                name: telemetry-config
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
          ports:
            - name: grpc
              containerPort: 9090
          # The gRPC health service is registered and left unauthenticated
          # (Public in the auth interceptor) exactly so probes need no token.
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 9090
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry
spec:
  selector:
    app.kubernetes.io/name: telemetry
  ports:
    - name: grpc
      port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-writer
        app.kubernetes.io/part-of: maagaparuga
    spec:
      containers:
        - name: telemetry-writer
          image: ghcr.io/marco-montesines/maagaparuga-telemetry:pinned
          args: ["write"]              # JetStream consumer -> batched ClickHouse inserts
          envFrom:
            - configMapRef:
                name: telemetry-config
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
          ports:
            - name: health
              containerPort: 9091
          # The writer has no service port; the `write` command runs a tiny
          # /healthz server (HEALTH_ADDR) purely so the consumer has a liveness
          # signal — a process that stops draining but stays up is restarted.
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
---
# Assessment reads questionnaire_responses + writes assessment_results/alerts in
# the app database, and reads vitals windows. VITALS_READER selects the source:
# `clickhouse` (direct read-only query) or `grpc` (telemetry GetWindow).
apiVersion: v1
kind: ConfigMap
metadata:
  name: assessment-config
data:
  DB_HOST: maagaparuga-pg-rw
  DB_PORT: "5432"
  DB_NAME: app
  DB_USER: app
  VITALS_READER: clickhouse
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: maagaparuga
  CLICKHOUSE_USER: maagaparuga     # dev: the existing CH user; a read-only user is P6
  WINDOW_MINUTES: "60"
  WINDOW_LIMIT: "500"
  # gRPC reader (VITALS_READER=grpc): TELEMETRY_GRPC + TELEMETRY_TOKEN injected at runtime.
  TELEMETRY_GRPC: telemetry:9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assessment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assessment
        app.kubernetes.io/part-of: maagaparuga
    spec:
      containers:
        - name: assessment
          image: ghcr.io/marco-montesines/maagaparuga-assessment:pinned
          envFrom:
            - configMapRef:
                name: assessment-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maagaparuga-pg-app
                  key: password
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: assessment
spec:
  selector:
    app.kubernetes.io/name: assessment
  ports:
    - name: http
      port: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: media-config
data:
  DB_HOST: maagaparuga-pg-rw
  DB_PORT: "5432"
  DB_NAME: app
  DB_USER: app
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: media
  S3_REGION: us-east-1               # SeaweedFS ignores it; boto3 requires one
  NATS_URL: nats://nats:4222
  OPENSEARCH_URL: http://opensearch:9200
  OPENSEARCH_INDEX: media_segments
  WHISPER_MODEL: base                # tiny|base|small (int8 CPU)
  WHISPER_COMPUTE_TYPE: int8
  WHISPER_CACHE_DIR: /models
  EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  EMBEDDING_DIMS: "384"
  HEALTH_ADDR: ":9091"
  MEDIA_API_URL: http://media:8000
  # Authorization. Default off in dev (warns loudly every start); `make
  # dev-media-auth` flips AUTH_MODE=jwt and injects the OpenFGA store/model ids.
  # Cloud overlays set AUTH_MODE=jwt. Reads need OpenFGA `viewer`, writes `editor`.
  AUTH_MODE: disabled
  OIDC_ISSUER: http://maagaparuga.test:9080
  OPENFGA_API_URL: http://openfga:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
spec:
  replicas: 1
  strategy:
    type: Recreate                    # single RWO model PVC — no two pods at once
  selector:
    matchLabels:
      app.kubernetes.io/name: media
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media
        app.kubernetes.io/part-of: maagaparuga
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001                # write the MiniLM cache PVC
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media
          image: ghcr.io/marco-montesines/maagaparuga-media:pinned
          args: ["api"]                # upload intake + catalog + search API (P4b)
          envFrom:
            - configMapRef:
                name: media-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maagaparuga-pg-app
                  key: password
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: media-s3
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: media-s3
                  key: S3_SECRET_KEY
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi          # loads MiniLM (torch) for query embedding
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models       # MiniLM query-embedding cache persists restarts
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: media-models-api
---
apiVersion: v1
kind: Service
metadata:
  name: media
spec:
  selector:
    app.kubernetes.io/name: media
  ports:
    - name: http
      port: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-models
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 3Gi                    # whisper + MiniLM weights, downloaded once
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-models-api             # the api's own RWO claim so its MiniLM cache
spec:                                # persists independently of the worker (multi-node safe)
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
spec:
  replicas: 1
  strategy:
    type: Recreate                    # single RWO model PVC — no two pods at once
  selector:
    matchLabels:
      app.kubernetes.io/name: media-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-worker
        app.kubernetes.io/part-of: maagaparuga
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001                # app (uid 10001) can write the mounted PVC
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-worker
          image: ghcr.io/marco-montesines/maagaparuga-media:pinned
          args: ["worker"]             # JetStream consumer: FFmpeg -> faster-whisper -> embeddings (P4b)
          envFrom:
            - configMapRef:
                name: media-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maagaparuga-pg-app
                  key: password
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: media-s3
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: media-s3
                  key: S3_SECRET_KEY
          ports:
            - name: health
              containerPort: 9091
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              memory: 3Gi             # faster-whisper (base/int8) + MiniLM + audio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: media-models
