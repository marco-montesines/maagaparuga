# OpenSearch 3.x — full-text search + logs + vector DB (ADR 0005, 0006).
# Single node by default; the cluster overlay demonstrates 3 nodes.
# Dev runs with the security plugin disabled (see overlays/dev); cloud
# overlays enable it with real credentials.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: maagaparuga
    spec:
      initContainers:
        # OpenSearch requires vm.max_map_count >= 262144 on the node.
        - name: sysctl
          image: busybox:pinned
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:pinned
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9600
          env:
            - name: discovery.type
              value: single-node
            # Heap: Xms == Xmx always; ~1/3-1/2 of the container limit so the
            # rest stays available as page cache for Lucene (production-derived
            # ratio; cloud overlays rescale both together).
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            # Production-derived safety settings:
            - name: action.destructive_requires_name
              value: "true"                 # no wildcard index deletes
            - name: gateway.auto_import_dangling_indices
              value: "false"                # never silently re-import stale shards
            - name: cluster.no_master_block
              value: write                  # reads stay up if the manager is lost
            - name: script.painless.regex.enabled
              value: "false"                # hardening + perf
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: admin-password
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              memory: 1536Mi
          # OpenSearch's JVM + shard recovery can take minutes on first boot;
          # startup gates liveness so that is never read as a hang (up to ~5m).
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          # Liveness stays a lightweight port check, NOT cluster health: a
          # yellow/red cluster is a readiness concern, the node is still alive.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
spec:
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
    - name: transport
      port: 9600
