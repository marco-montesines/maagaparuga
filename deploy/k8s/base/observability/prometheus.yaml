# Prometheus — metrics scrape + storage (ADR 0005). Minimal single-replica
# start of the observability tier: it scrapes the CloudNativePG instance
# metrics (backup freshness, WAL archiving) that the backup-failure alert
# evaluates in Grafana. More scrape targets (app services via OTel, gateway,
# brokers) land as the tier grows; Grafana owns alerting (no Alertmanager).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# Namespaced RBAC: discovery is limited to this namespace (no ClusterRole) —
# least privilege for a same-namespace scrape.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [pods, endpoints, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # CloudNativePG instance metrics — exposes the backup timestamps the
      # backup-failure alert uses. Discover cluster pods, keep the metrics port.
      - job_name: cnpg
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [maagaparuga]
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_cnpg_io_cluster
              - __meta_kubernetes_pod_container_port_name
            regex: maagaparuga-pg;metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            target_label: cnpg_cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: maagaparuga
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:pinned
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
