# Redis — sessions, cache, rate-limit counters. Exactly one job (ADR 0005/0006).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: maagaparuga
    spec:
      containers:
        - name: redis
          image: redis:pinned
          args:
            - redis-server
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness detects a wedged process; kept lenient (failureThreshold)
          # so a brief stall under LRU eviction is not a restart.
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
