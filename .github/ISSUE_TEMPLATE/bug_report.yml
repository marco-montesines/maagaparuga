name: Bug report
description: Report a problem in the code, container images, CI, or infrastructure.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include real personal or health data** —
        this is a research and educational project that runs only mock data.
        For security vulnerabilities, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it? Commands, config, and the affected component.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Component/service, versions, and how you're running it (minikube dev, cluster, CI…).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant logs or error output. Redact anything sensitive.
      render: shell
    validations:
      required: false
