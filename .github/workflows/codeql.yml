# CodeQL static analysis for the compiled/interpreted languages GitHub supports
# (Go + Python). PHP is covered by Semgrep in security.yml (CodeQL has no PHP).
#
# Results upload to the repository's Security tab (code scanning), which is FREE
# once the repository is PUBLIC. On a private repo the upload needs GitHub
# Advanced Security and otherwise fails ("Code scanning is not enabled"), so for
# now this runs on manual dispatch only. At the public flip, add the automatic
# triggers below to gate every push and PR:
#     push: { branches: [master] }
#     pull_request:
#     schedule: [{ cron: "0 6 * * 1" }]
name: codeql

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: services/telemetry/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Go is a single module under services/telemetry; build it so CodeQL can
      # trace the compilation (build-mode: manual).
      - if: matrix.language == 'go'
        name: Build Go
        run: go build ./...
        working-directory: services/telemetry

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
