# CodeQL static analysis for the compiled/interpreted languages GitHub supports
# (Go + Python). PHP is covered by Semgrep in security.yml (CodeQL has no PHP).
#
# Results upload to the repository's Security tab (code scanning), which is FREE
# once the repository is public. While the repo is private the upload needs
# GitHub Advanced Security — so expect the "analyze" upload to fail until the
# public flip (the analysis itself still runs). Enable code scanning at the flip.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: services/telemetry/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Go is a single module under services/telemetry; build it so CodeQL can
      # trace the compilation (build-mode: manual).
      - if: matrix.language == 'go'
        name: Build Go
        run: go build ./...
        working-directory: services/telemetry

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
