# FinOps guardrail — block infra changes that breach budget, use a disallowed
# machine type, or drop the required cost-attribution labels. Runs cost-guard
# (tools/cost-guard) against a real `terragrunt plan` for each environment.
#
# SCAFFOLD — dormant until the cloud backend exists. The cost-guard job is gated
# on `vars.TG_STATE_BUCKET` (see the job's `if:`), so it SKIPS cleanly until the
# settings below are configured, then activates automatically. cost-guard itself
# is committed and tested (tools/cost-guard/README.md); this wires it into PRs.
#
# ── TO ACTIVATE (once the B2 state bucket + Hetzner project exist) ────────────
# Settings → Secrets and variables → Actions:
#   Secrets:
#     HCLOUD_TOKEN, TF_STATE_ACCESS_KEY_ID, TF_STATE_SECRET_ACCESS_KEY
#       — mirror infra/terragrunt/env.sh: the Hetzner token + the B2 S3 key/secret
#         mapped onto AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
#     TF_VAR_admin_allowed_ips   e.g. ["1.2.3.4/32"]   ┐ the two REQUIRED tfvars
#     TF_VAR_ssh_key_names       e.g. ["mykey"]        ┘ inputs (no defaults) that
#       normally live in the gitignored secrets.auto.tfvars and are ABSENT in CI.
#   Variables:
#     TG_STATE_BUCKET, TG_STATE_ENDPOINT, TG_STATE_REGION
#       — same values as env.sh (e.g. maagaparuga-tfstate /
#         https://s3.eu-central-003.backblazeb2.com / eu-central-003).
# Then UNCOMMENT the two TF_VAR_* lines in this job's `env:` block below — the
# plan needs them and they are not wired yet.
# Also commit a price snapshot once so `check` runs offline:
#   HCLOUD_TOKEN=... python3 tools/cost-guard/cost_guard.py refresh --date <YYYY-MM-DD>
#   git add tools/cost-guard/prices.json
# Runs on same-repo PRs only (forks/Dependabot get no secrets).
# ─────────────────────────────────────────────────────────────────────────────
name: finops

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/finops.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-guard:
    # Skip until the remote-state backend is configured (TG_STATE_BUCKET var set)
    # — the plan needs real B2/Hetzner creds, so before then there is nothing to
    # check and the job would only fail. Also skip fork/Dependabot PRs (no secrets).
    # Once the backend vars/secrets exist, this activates automatically.
    if: >-
      vars.TG_STATE_BUCKET != '' &&
      (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TG_STATE_BUCKET: ${{ vars.TG_STATE_BUCKET }}
      TG_STATE_ENDPOINT: ${{ vars.TG_STATE_ENDPOINT }}
      TG_STATE_REGION: ${{ vars.TG_STATE_REGION }}
      # Required tfvars inputs (normally in the gitignored secrets.auto.tfvars, so
      # absent in CI). UNCOMMENT to activate — see the "TO ACTIVATE" header block.
      # TF_VAR_admin_allowed_ips: ${{ secrets.TF_VAR_ADMIN_ALLOWED_IPS }}
      # TF_VAR_ssh_key_names: ${{ vars.TF_VAR_SSH_KEY_NAMES }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Install Terragrunt
        run: |
          TG_VERSION=0.67.0
          sudo curl -sSfL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          sudo chmod +x /usr/local/bin/terragrunt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Plan ${{ matrix.environment }}
        working-directory: infra/terragrunt/${{ matrix.environment }}
        run: |
          terragrunt init -input=false
          terragrunt plan -out=tf.plan -input=false
          terragrunt show -json tf.plan > plan.json
      - name: cost-guard check
        run: >
          python3 tools/cost-guard/cost_guard.py check
          --plan "infra/terragrunt/${{ matrix.environment }}/plan.json"
          --env "${{ matrix.environment }}"
