# CI quality gate. Per-language lint + type-check + test lanes, plus proto, IaC,
# and secret-scan lanes. Runs on every PR and on push to master. Each lane is an
# independent job so they run in parallel and a failure names the language.
#
# SAST / dependency-audit / image + IaC vuln scanning live in security.yml and
# codeql.yml; the cost gate lives in the terraform plan workflow; deploy +
# post-deploy smoke live in the deploy workflows. This file is the fast feedback.
#
# Action pinning: actions/* by major tag; third-party actions are on major tags
# for now, kept current by Dependabot (see .github/dependabot.yml).
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: php (web) — pint · larastan · pest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4" # matches composer.lock + the FrankenPHP runtime image
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: App key (tests need it)
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pint (format check)
        run: ./vendor/bin/pint --test
      - name: Larastan (phpstan level 6)
        run: ./vendor/bin/phpstan analyse --no-progress
      - name: Pest (sqlite :memory:, per phpunit.xml)
        run: ./vendor/bin/pest --no-coverage

  go:
    name: go (telemetry) — golangci-lint · test · govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/telemetry
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/telemetry/go.mod
          cache-dependency-path: services/telemetry/go.sum
      # Build golangci-lint from source with the project's Go toolchain
      # (GOTOOLCHAIN=local) — a prebuilt release binary is built with an older Go
      # and refuses a `go 1.26` module ("used to build golangci-lint is lower
      # than the targeted Go version").
      - name: golangci-lint (v2, built with the project toolchain)
        env:
          GOTOOLCHAIN: local
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --timeout 5m
      - name: Test (race + coverage)
        run: go test -race -covermode=atomic ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  python:
    name: python — ruff · mypy · pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [assessment, media]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # media's worker-only ML stack (torch/faster-whisper/sentence-transformers)
      # is a runtime dep but LAZY-imported, so tests don't need it loaded — install
      # the CPU torch wheel first (mirrors the Dockerfile) so `pip install .` never
      # pulls the multi-GB CUDA build.
      - name: CPU torch (media only)
        if: matrix.service == 'media'
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install (with dev extras)
        run: pip install -e '.[dev]'
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q

  proto:
    name: proto — buf lint + breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # breaking check needs history to diff against master
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: Lint (STANDARD)
        run: buf lint
        working-directory: proto
      # Compare against the PR's base commit in the LOCAL clone (fetch-depth 0)
      # rather than cloning the repo over HTTPS — the latter can't authenticate
      # to a private repo ("could not read Username for github.com").
      - name: Breaking-change check vs master
        if: github.event_name == 'pull_request'
        run: buf breaking proto --against ".git#ref=${{ github.event.pull_request.base.sha }},subdir=proto"

  iac:
    name: iac — tofu fmt · validate · ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: OpenTofu fmt check
        run: tofu fmt -check -recursive infra
      - name: OpenTofu validate (each module, no backend)
        run: |
          set -e
          for m in infra/modules/*/; do
            if ls "$m"*.tf >/dev/null 2>&1; then
              echo "== validate $m =="
              tofu -chdir="$m" init -backend=false -input=false >/dev/null
              tofu -chdir="$m" validate
            fi
          done
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ansible-lint
        run: |
          pip install ansible-lint
          ansible-galaxy collection install -r requirements.yml
          ansible-lint
        working-directory: infra/ansible

  secrets:
    name: secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the tip
      # Run the gitleaks CLI directly: the v2 action crashes on Node 24 during
      # its octokit call on pull_request events. The CLI auto-loads .gitleaks.toml
      # and works on any event.
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: gitleaks detect
        run: gitleaks detect --source . --redact --no-banner
