# Build the MkDocs Material documentation site and publish it to GitHub Pages.
# Enable once in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt
      # --strict fails the build on any broken link or bad anchor — a
      # documentation quality gate on every PR.
      - name: Build docs (strict) into /docs
        run: mkdocs build --strict --site-dir _site/docs
      # The static welcome/landing page is the site root; docs live under /docs.
      - name: Assemble the landing page at the root
        run: cp -R landing/. _site/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # Only publish once GitHub Pages is enabled: Settings -> Pages -> Source
    # "GitHub Actions", then add repository variable PAGES_ENABLED = true. Until
    # then the strict build above is the gate and NO failing Pages deployment is
    # created (avoids a wall of red on the Deployments page while private).
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
